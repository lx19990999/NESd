name: CI pipeline
on: [push]

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  detect-changes:
    runs-on: ubuntu-22.04
    outputs:
      build-relevant: ${{ steps.filter.outputs.build-relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build-relevant:
              - 'packages/**'
              - '.fvmrc'
              - 'macos/**'
              - 'linux/**'
              - 'windows/**'
              - 'android/**'

  lint:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/jpjonte/flutter:stable
    steps:
      - uses: actions/checkout@v6
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze

  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/jpjonte/flutter:stable
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - run: flutter pub get
      - run: |
          cd packages/nesd
          flutter test --coverage
      - run: ci/0-test/extract_coverage.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './pages'

  publish-coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    needs: [test]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  build-android:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/jpjonte/flutter:stable
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - id: env
        run: ci/env.sh
      - run: ci/1-build/prepare.sh
      - run: ci/1-build/android/prepare.sh
        env:
          KEY_STORE_BASE64: ${{ secrets.ANDROID_KEY_STORE }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      - run: ci/1-build/android/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.env.outputs.artifact_flavored }}.android.apk
          path: '*.apk'
          if-no-files-found: error

  release_nightly:
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.build-relevant == 'true'
    runs-on: ubuntu-22.04
    needs:
      - detect-changes
      - build-android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - id: changelog
        run: ci/3-release/extract_changelog_nightly.sh
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - id: env
        run: ci/env.sh
      - run: gh release delete nightly --cleanup-tag -y
      - uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/*
          name: NESd nightly
          tag: nightly
          body: ${{ steps.changelog.outputs.changes }}
          artifactErrorsFailBuild: true
          prerelease: true
          allowUpdates: true
          removeArtifacts: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs:
      - build-android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - id: changelog
        run: ci/3-release/extract_changelog.sh
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - id: env
        run: ci/env.sh
      - uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/*
          name: NESd ${{ steps.env.outputs.release_name }}
          body: ${{ steps.changelog.outputs.changes }}
          artifactErrorsFailBuild: true
